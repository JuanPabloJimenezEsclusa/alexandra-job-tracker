receivers:
  otlp:
    protocols:
      http: { endpoint: "0.0.0.0:4318" }
      grpc: { endpoint: "0.0.0.0:4317" }
processors:
  batch: { }
  # Drop actuator spans/metrics so /api/actuator/** never reaches Tempo/Prometheus.
  # Covers the custom TracingFilter span names ("GET /api/actuator/health") and the
  # Micrometer OTel bridge spans (contextual name "GET /actuator/...", http.path /
  # url.path attributes).
  filter/actuator:
    error_mode: ignore
    traces:
      span:
        - IsMatch(name, ".*actuator.*")
        - IsMatch(attributes["http.path"], ".*actuator.*")
        - IsMatch(attributes["url.path"], ".*actuator.*")
    metrics:
      datapoint:
        - metric.name == "http.server.requests" and (IsMatch(attributes["http.route"], "^/actuator") or IsMatch(attributes["uri"], "^/actuator"))
exporters:
  prometheus: { endpoint: "0.0.0.0:8889" }
  otlp:
    endpoint: tempo:4317
    tls: { insecure: true }
extensions:
  health_check: { }
service:
  extensions: [ health_check ]
  pipelines:
    metrics: { receivers: [ otlp ], processors: [ filter/actuator, batch ], exporters: [ prometheus ] }
    traces: { receivers: [ otlp ], processors: [ filter/actuator, batch ], exporters: [ otlp ] }
