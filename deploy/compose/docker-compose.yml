x-resources: &default-resources
  deploy:
    resources:
      limits: { cpus: "1", memory: "512M" }
      reservations: { cpus: "0.25", memory: "256M" }

services:
  job-tracker-server:
    container_name: alexandra-job-tracker-server
    hostname: job-tracker-server
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    ports: [ "8880:8880" ]
    volumes: [ "h2data:/app/data" ]
    environment:
      SPRING_PROFILES_ACTIVE: "dev"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      JVM_OPTIONS: "-Xms1024m -Xmx2048m"
      JAVA_OPTS: "-XX:+UseCompactObjectHeaders -XX:+UseContainerSupport --enable-native-access=ALL-UNNAMED -Djava.security.egd=file:/dev/./urandom"
    networks: [ jobtracker ]
    deploy:
      resources:
        limits: { cpus: "2", memory: "2048M" }
        reservations: { cpus: "1", memory: "1024M" }
    healthcheck:
      test: [ "CMD", "curl", "-f", "-o", "/dev/null", "http://localhost:8880/api/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.152.0-nightly.286fff0
    container_name: alexandra-otel-collector
    hostname: otel-collector
    restart: unless-stopped
    ports: [ "4318:4318", "8889:8889" ]
    volumes: [ "./otel-collector.yml:/etc/otelcol-contrib/config.yaml" ]
    depends_on: [ tempo, prometheus ]
    networks: [ jobtracker ]
    <<: *default-resources

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: alexandra-prometheus
    hostname: prometheus
    restart: unless-stopped
    ports: [ "9090:9090" ]
    volumes: [ "./prometheus.yml:/etc/prometheus/prometheus.yml" ]
    command: [ "--config.file=/etc/prometheus/prometheus.yml" ]
    networks: [ jobtracker ]
    <<: *default-resources
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  tempo:
    image: grafana/tempo:3.0.0
    container_name: alexandra-tempo
    hostname: tempo
    restart: unless-stopped
    ports: [ "3200:3200" ]
    volumes: [ "./tempo.yml:/etc/tempo.yaml" ]
    command: [ "-config.file=/etc/tempo.yaml" ]
    networks: [ jobtracker ]
    <<: *default-resources
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3200/ready" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  grafana:
    image: grafana/grafana:13.0.2
    container_name: alexandra-grafana
    hostname: grafana
    restart: unless-stopped
    ports: [ "3000:3000" ]
    volumes:
      - "./grafana/dashboards:/etc/grafana/provisioning/dashboards"
      - "./grafana/datasources:/etc/grafana/provisioning/datasources"
    depends_on: [ prometheus, tempo ]
    networks: [ jobtracker ]
    <<: *default-resources
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: alexandra-cadvisor
    hostname: cadvisor
    restart: unless-stopped
    networks: [ jobtracker ]
    <<: *default-resources
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports: [ "8080:8080" ]

volumes:
  h2data:

networks:
  jobtracker:
    name: jobtracker-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
