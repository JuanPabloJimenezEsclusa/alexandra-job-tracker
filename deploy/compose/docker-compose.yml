x-resources: &default-resources
  deploy:
    resources:
      limits: { cpus: "1", memory: "512M" }
      reservations: { cpus: "0.25", memory: "256M" }

x-k6-base: &k6-base
  image: grafana/k6:2.2.0
  user: ${K6_UID:-12345}
  hostname: k6
  depends_on:
    job-tracker-server:
      condition: service_healthy
  entrypoint: ["/bin/sh", "/scripts/k6-run.sh"]
  volumes:
    - ../../testing-pentest/src/test/k6:/scripts
    - ../../testing-pentest/src/test/k6/reports:/reports
  environment:
    TARGET_URL: http://job-tracker-server:8880/api/graphql
  networks: [ jobtracker ]
  <<: *default-resources

services:
  job-tracker-server:
    container_name: alexandra-job-tracker-server
    hostname: job-tracker-server
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: ${DOCKERFILE:-deploy/compose/Dockerfile}
    depends_on:
      postgres:
        condition: service_healthy
    ports: [ "8880:8880", "127.0.0.1:5005:5005" ]
    environment:
      SPRING_PROFILES_ACTIVE: "dev"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobtracker}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-jobtracker}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-jobtracker}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-}
      LC_CTYPE: ${LC_CTYPE:-}
      JWT_SECRET: ${JWT_SECRET:-}
      OTEL_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: job-tracker-server
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      JVM_OPTIONS: "-Xms1024m -Xmx2048m"
      JAVA_OPTS: "-XX:+UseCompactObjectHeaders -XX:+UseContainerSupport --enable-native-access=ALL-UNNAMED -Djava.security.egd=file:/dev/./urandom"
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
    networks: [ jobtracker ]
    deploy:
      resources:
        limits: { cpus: "2", memory: "2048M" }
        reservations: { cpus: "1", memory: "1024M" }
    healthcheck:
      test: [ "CMD", "curl", "-f", "-o", "/dev/null", "http://localhost:8880/api/actuator/health/readinessState" ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: alexandra-postgres
    hostname: postgres
    restart: unless-stopped
    ports: [ "127.0.0.1:${POSTGRES_PORT:-5432}:5432" ]
    volumes: [ "../data/postgres:/var/lib/postgresql/data" ]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobtracker}
      POSTGRES_USER: ${POSTGRES_USER:-jobtracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobtracker}
    networks: [ jobtracker ]
    <<: *default-resources
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobtracker} -d ${POSTGRES_DB:-jobtracker}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer:5.5.0
    container_name: alexandra-adminer
    hostname: adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports: [ "8081:8080" ]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks: [ jobtracker ]
    <<: *default-resources

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: alexandra-otel-collector
    hostname: otel-collector
    restart: unless-stopped
    ports: [ "4318:4318", "8889:8889" ]
    volumes: [ "./otel-collector.yml:/etc/otelcol-contrib/config.yaml" ]
    depends_on: [ tempo, prometheus ]
    networks: [ jobtracker ]
    <<: *default-resources

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: alexandra-prometheus
    hostname: prometheus
    restart: unless-stopped
    ports: [ "9090:9090" ]
    volumes: [ "./prometheus.yml:/etc/prometheus/prometheus.yml" ]
    command: [ "--config.file=/etc/prometheus/prometheus.yml" ]
    networks: [ jobtracker ]
    <<: *default-resources
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  tempo:
    image: grafana/tempo:3.0.3
    container_name: alexandra-tempo
    hostname: tempo
    restart: unless-stopped
    ports: [ "3200:3200" ]
    volumes: [ "./grafana/tempo.yml:/etc/tempo.yaml" ]
    command: [ "-config.file=/etc/tempo.yaml" ]
    networks: [ jobtracker ]
    <<: *default-resources

  loki:
    image: grafana/loki:3.7.7
    container_name: alexandra-loki
    hostname: loki
    restart: unless-stopped
    ports: [ "3100:3100" ]
    volumes: [ "./grafana/loki.yml:/etc/loki/config.yaml" ]
    command: [ "-config.file=/etc/loki/config.yaml" ]
    networks: [ jobtracker ]
    <<: *default-resources

  promtail:
    image: grafana/promtail:3.6.11
    container_name: alexandra-promtail
    hostname: promtail
    restart: unless-stopped
    volumes:
      - "./grafana/promtail.yml:/etc/promtail/config.yaml"
      - "/var/log:/var/log:ro"
      - "/var/lib/docker/containers:/var/lib/docker/containers:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    command: [ "-config.file=/etc/promtail/config.yaml" ]
    networks: [ jobtracker ]
    <<: *default-resources

  grafana:
    image: grafana/grafana:13.2.2
    container_name: alexandra-grafana
    hostname: grafana
    restart: unless-stopped
    ports: [ "3000:3000" ]
    volumes:
      - "./grafana/dashboards:/etc/grafana/provisioning/dashboards"
      - "./grafana/datasources:/etc/grafana/provisioning/datasources"
    depends_on: [ prometheus, tempo, loki ]
    networks: [ jobtracker ]
    <<: *default-resources
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: alexandra-cadvisor
    hostname: cadvisor
    restart: unless-stopped
    networks: [ jobtracker ]
    <<: *default-resources
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports: [ "8080:8080" ]

  # Performance and Penetration Testing Services
  k6-pen:
    <<: *k6-base
    profiles: [pen-test]
    container_name: alexandra-k6-pen
    environment:
      K6_TEST_TYPE: pen
      TARGET_URL: http://job-tracker-server:8880/api/graphql

  k6-perf:
    <<: *k6-base
    profiles: [perf-test]
    container_name: alexandra-k6-perf
    environment:
      K6_TEST_TYPE: perf
      TARGET_URL: http://job-tracker-server:8880/api/graphql

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: [pen-test]
    container_name: alexandra-zap
    hostname: zap
    depends_on:
      job-tracker-server:
        condition: service_healthy
    command:
      - /zap/zap.sh
      - -cmd
      - -loglevel
      - debug
      - -autorun
      - /zap/wrk/plan.yaml
    volumes:
      - ../../testing-pentest/src/test/zap:/zap/wrk
    networks: [ jobtracker ]
    deploy:
      resources:
        limits: { cpus: "1", memory: "1024M" }
        reservations: { cpus: "1", memory: "1024M" }

networks:
  jobtracker:
    name: jobtracker-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
