name: Continuous Integration

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: "-Xmx2048m"
  MAVEN_CLI_OPTS: "-B -ntp -e"

jobs:
  test:
    permissions: { contents: read, pull-requests: write }
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: pro
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 25
          cache: maven

      - name: Build & Test
        run: mvn ${MAVEN_CLI_OPTS} clean verify

      - name: SonarCloud Analysis
        run: mvn ${MAVEN_CLI_OPTS} sonar:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: "./coverage-jacoco/target/site/jacoco-aggregate/index.html"

  dependency-review:
    needs: test
    permissions: { contents: read, pull-requests: write }
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: true
          base-ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-ref: ${{ github.event.pull_request.head.sha || github.event.after }}

  native-compatibility:
    needs: test
    permissions: { contents: read, pull-requests: write }
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: 25
          cache: maven

      - name: AOT process (server)
        run: mvn ${MAVEN_CLI_OPTS} -Pnative test-compile -pl bootstrap-server -am

      - name: AOT process (CLI)
        run: mvn ${MAVEN_CLI_OPTS} -Pnative test-compile -pl bootstrap-cli -am
