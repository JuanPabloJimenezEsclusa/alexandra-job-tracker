name: Performance Test

on:
  push:
    branches: [develop]

concurrency:
  group: perf-test
  cancel-in-progress: true

env:
  MAVEN_CLI_OPTS: "-B -ntp -e"
  JWT_SECRET: "change-me-in-production-at-least-32-chars-long!!"

jobs:
  perf-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 25
          cache: maven

      - name: Build server image
        run: mvn ${MAVEN_CLI_OPTS} package -pl bootstrap-server -am -DskipTests

      - name: Run performance tests (load + spike + soak)
        run: mvn ${MAVEN_CLI_OPTS} verify -pl testing-pentest -Pperf-test

      - name: Upload load test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-load-report
          path: testing-pentest/src/test/k6/reports/k6-load.html

      - name: Upload spike test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-spike-report
          path: testing-pentest/src/test/k6/reports/k6-spike.html

      - name: Upload soak test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-soak-report
          path: testing-pentest/src/test/k6/reports/k6-soak.html
