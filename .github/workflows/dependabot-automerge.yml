name: Dependabot Automerge

on:
  pull_request_target:

concurrency:
  group: dependabot-automerge
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve PR
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment decision summary
        if: always()
        run: |
          if [ "${{ steps.metadata.outputs.update-type }}" = "version-update:semver-major" ]; then
            gh pr comment "$PR_URL" --body "🤖 **Dependabot Automerge** — skipped (major update requires manual review)"
          else
            gh pr comment "$PR_URL" --body "🤖 **Dependabot Automerge** — approved + auto-merge enabled (${{ steps.metadata.outputs.update-type }}). Merge will complete when CI passes."
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
