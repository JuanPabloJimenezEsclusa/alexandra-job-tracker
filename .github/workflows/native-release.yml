name: Native Release

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: [src, deploy, docs, browser-extension]

concurrency:
  group: native
  cancel-in-progress: true

env:
  MAVEN_OPTS: "-Xmx2048m"
  MAVEN_CLI_OPTS: "-B -ntp -e"

jobs:
  native-build:
    if: github.event.pull_request.draft == false
    permissions: { contents: read, pull-requests: write, id-token: write, packages: write }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: graalvm
          java-version: 25
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build install
        run: mvn ${MAVEN_CLI_OPTS} clean install -DskipTests

      - name: Build native CLI binary
        run: mvn ${MAVEN_CLI_OPTS} -Pnative native:compile -pl bootstrap-cli -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Maven version
        id: version
        run: echo "maven_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout 2>/dev/null | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Lowercase repository
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deploy/compose/Dockerfile.native
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.version.outputs.maven_version }}

      - name: Upload CLI binary to release
        uses: actions/upload-artifact@v7
        with:
          name: job-tracker-cli
          path: bootstrap-cli/target/job-tracker-cli
          archive: false
          overwrite: true
