name: Native Release

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: "-Xmx2048m"
  MAVEN_CLI_OPTS: "--no-transfer-progress -B -ntp -e"

jobs:
  native-build:
    permissions: { contents: read, pull-requests: write }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: 25
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Install all modules (no tests)
        run: mvn install -DskipTests

      - name: Build native server image
        run: mvn -Pnative native:compile -pl bootstrap-server -DskipTests

      - name: Build native CLI binary
        run: mvn -Pnative native:compile -pl bootstrap-cli -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/compose/Dockerfile.native
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }},ghcr.io/${{ github.repository }}:latest

      - name: Upload CLI binary to release
        uses: softprops/action-gh-release@v3
        with:
          files: bootstrap-cli/target/job-tracker-cli
