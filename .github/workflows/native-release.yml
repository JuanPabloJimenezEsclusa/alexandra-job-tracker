name: Native Release

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: [src, deploy, docs, browser-extension]

concurrency:
  group: native
  cancel-in-progress: true

env:
  MAVEN_OPTS: "-Xmx2048m"
  MAVEN_CLI_OPTS: "-B -ntp -e"

jobs:
  native-build:
    if: github.event.pull_request.draft == false
    permissions: { contents: read, pull-requests: write, id-token: write, packages: write }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: 25
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build install
        run: mvn ${MAVEN_CLI_OPTS} clean install -DskipTests

      - name: Build native server image
        run: mvn ${MAVEN_CLI_OPTS} -Pnative native:compile -pl bootstrap-server -DskipTests

      - name: Build native CLI binary
        run: mvn ${MAVEN_CLI_OPTS} -Pnative native:compile -pl bootstrap-cli -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Maven version
        id: version
        run: echo "maven_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout 2>/dev/null | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Lowercase repository
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: deploy/compose/Dockerfile.native
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.version.outputs.maven_version }}

      - name: Configure AWS credentials
        if: startsWith(github.ref, 'refs/tags/v')
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64

      - name: Build & push Lambda image to ECR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: deploy/aws/Dockerfile.native
          push: true
          tags: |
            ${{ secrets.AWS_ECR_REGISTRY }}/ajt-serverless:${{ steps.version.outputs.maven_version }}
            ${{ secrets.AWS_ECR_REGISTRY }}/ajt-serverless:latest

      - name: Upload CLI binary to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: bootstrap-cli/target/job-tracker-cli
