info:
  name: mutation.uploadResume
  type: graphql
  seq: 8

graphql:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Accept
      value: application/json
  body:
    query: |
      mutation($fileName: String!, $content: String!) { 
        uploadResume(fileName: $fileName, content: $content) {
          id, fileName, content, isBaseVersion, tailoredForJobId, createdAt
        }
      }
    variables: |-
      {
        "fileName": "{{randomFilename}}",
        "content": "{{randomContent}}"
      }
  auth: inherit

runtime:
  variables:
    - name: randomFilename
      value: JPJE-1.pdf
    - name: randomContent
      value: Tech Lead

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
