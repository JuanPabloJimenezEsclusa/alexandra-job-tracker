info:
  name: mutation.tailorResume
  type: graphql
  seq: 9

graphql:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Accept
      value: application/json
  body:
    query: |
      mutation($resumeId: ID!, $jobId: ID!) { 
        tailorResume(resumeId: $resumeId, jobId: $jobId) {
          id, fileName, content, isBaseVersion, tailoredForJobId, createdAt
        }
      }
    variables: |-
      {
        "resumeId": "{{randomResumeId}}",
        "jobId": "{{randomJobId}}"
      }
  auth: inherit

runtime:
  variables:
    - name: randomResumeId
      value: "1"
    - name: randomJobId
      value: "1"
  scripts:
    - type: before-request
      code: |-
        const randomId = Math.floor(Math.random() * 100) + 1;
        bru.setVar("randomProductId", randomId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
