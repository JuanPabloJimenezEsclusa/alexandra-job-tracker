info:
  name: query.analytics
  type: graphql
  seq: 13

graphql:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Accept
      value: application/json
  body:
    query: |
      query($since: Instant) {
        analytics(since: $since) {
          totalApplications, perStatus { saved }, conversionRate
        }
      }
    variables: |-
      {

      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
