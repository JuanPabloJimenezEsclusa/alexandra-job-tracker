info:
  name: mutation.login
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Accept
      value: application/json
  body:
    query: |
      mutation ($username: String!, $password: String!) { 
        login(username: $username, password: $password) { token user { username role } }
      }
    variables: |
      {
        "username": "{{randomUsername}}",
        "password": "{{randomPassword}}"
      }

runtime:
  variables:
    - name: randomUsername
      value: JPJE
    - name: randomPassword
      value: JPJE
  scripts:
    - type: after-response
      code: |-
        const token = res.body.data.login.token;
        bru.setVar("authToken", token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
