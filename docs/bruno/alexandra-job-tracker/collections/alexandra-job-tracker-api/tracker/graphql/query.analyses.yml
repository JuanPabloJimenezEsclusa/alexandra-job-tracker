      query {
        analyses {
          id, jobPostingId, summary, seniority, softSkills, technicalSkills,
          fitScore, companyRating, companyType, salaryMin, salaryMax, salaryCurrency, createdAt
        }
      }
    variables: |-
      {
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
