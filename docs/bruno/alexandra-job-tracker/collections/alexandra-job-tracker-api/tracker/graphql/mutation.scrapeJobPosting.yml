info:
  name: mutation.scrapeJobPosting
  type: graphql
  seq: 7

graphql:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Accept
      value: application/json
  body:
    query: |
      mutation($url: String!) { 
        scrapeJobPosting(url: $url) {
          id, url, source, title, company, description, postedAt
        }
      }
    variables: |-
      {
         "url": "{{$randomUrl}}"
      }
  auth: inherit

runtime:
  variables:
    - name: randomUrl
      value: httpd://linkedin.com

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
