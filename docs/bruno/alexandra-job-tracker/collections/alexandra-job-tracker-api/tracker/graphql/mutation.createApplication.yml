info:
  name: mutation.createApplication
  type: graphql
  seq: 5

graphql:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Accept
      value: application/json
  body:
    query: |
      mutation($jobPostingId: ID!, $notes: String) { 
        createApplication(jobPostingId: $jobPostingId, notes: $notes) { 
          id, jobPostingId, status, dateApplied, lastUpdated, notes
        } 
      }
    variables: |-
      {
        "jobPostingId": "{{randomPostingId}}",
        "notes": "{{randomNotes}}"
      }
  auth: inherit

docs:
  content: |
    Tracks a new application for an existing job posting (company, role, source and
    URL come from the posting: run mutation.submitJobPosting first and use its id).

runtime:
  variables:
    - name: randomPostingId
      value: "00000000-0000-0000-0000-000000000000"
    - name: randomNotes
      value: Interesting
  scripts:
    - type: before-request
      code: |-
        const randomId = Math.floor(Math.random() * 100) + 1;
        bru.setVar("randomProductId", randomId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
