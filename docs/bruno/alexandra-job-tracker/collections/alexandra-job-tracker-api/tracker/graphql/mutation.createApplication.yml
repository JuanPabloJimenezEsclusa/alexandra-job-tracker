info:
  name: mutation.createApplication
  type: graphql
  seq: 4

graphql:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Accept
      value: application/json
  body:
    query: |
      mutation($company: String!, $role: String!, $source: Source!, $postingUrl: String, $notes: String) { 
        createApplication(company: $company, role: $role, source: $source, postingUrl: $postingUrl, notes: $notes) { 
          id, company, role, source, postingUrl, notes, status, dateApplied, lastUpdated
        } 
      }
    variables: |-
      {
        "company": "{{randomCompany}}",
        "role": "{{randomRole}}",
        "source": "{{randomSource}}",
        "postingUrl": "{{randomPostingUrl}}",
        "notes": "{{randomNotes}}"
      }
  auth: inherit

runtime:
  variables:
    - name: randomCompany
      value: ACME
    - name: randomRole
      value: Tech Lead
    - name: randomSource
      value: LINKEDIN
    - name: randomPostingUrl
      value: https://linkedin.com
    - name: randomNotes
      value: Interesting
  scripts:
    - type: before-request
      code: |-
        const randomId = Math.floor(Math.random() * 100) + 1;
        bru.setVar("randomProductId", randomId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
