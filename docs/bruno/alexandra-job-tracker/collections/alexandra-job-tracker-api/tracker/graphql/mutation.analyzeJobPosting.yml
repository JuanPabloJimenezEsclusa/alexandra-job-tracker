info:
  name: mutation.analyzeJobPosting
  type: graphql
  seq: 9

graphql:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Accept
      value: application/json
  body:
    query: |
      mutation($jobPostingId: ID!) { 
        analyzeJobPosting(jobPostingId: $jobPostingId) {
          id, jobPostingId, summary, seniority, softSkills, technicalSkills,
          fitScore, companyRating, companyType, salaryMin, salaryMax, salaryCurrency, createdAt
        }
      }
    variables: |-
      {
        "jobPostingId": "{{jobPostingId}}"
      }
  auth: inherit

runtime:
  variables:
    - name: jobPostingId
      value: "00000000-0000-0000-0000-000000000000"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
