info:
  name: mutation.analyzeJobPosting
  type: graphql
  seq: 8

graphql:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Accept
      value: application/json
  body:
    query: |
      mutation($jobPostingId: ID!) { 
        analyzeJobPosting(jobPostingId: $jobPostingId) {
          summary, skills, fitScore
        }
      }
    variables: |-
      {
        "jobPostingId": "{{jobPostingId}}"
      }
  auth: inherit

runtime:
  variables:
    - name: jobPostingId
      value: "00000000-0000-0000-0000-000000000000"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
