info:
  name: mutation.loginAdmin
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Accept
      value: application/json
  body:
    query: |
      mutation ($username: String!, $password: String!) { 
        login(username: $username, password: $password) { token }
      }
    variables: |
      {
        "username": "alexandra",
        "password": "password123"
      }

docs:
  content: |
    Admin login (alexandra / password123).
    Stores an ADMIN token in authToken, required for register and deleteAnalysis.

runtime:
  scripts:
    - type: after-response
      code: |-
        const token = res.body.data.login.token;
        bru.setVar("authToken", token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
