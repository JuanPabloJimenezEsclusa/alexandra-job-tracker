info:
  name: mutation.register
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Accept
      value: application/json
  body:
    query: |
      mutation($username: String!, $password: String!, $role: Role!) { 
        register(username: $username, password: $password, role: $role) { token user { username role } } 
      }
    variables: |-
      {
        "username": "{{randomUsername}}",
        "password": "{{randomPassword}}",
        "role": "{{randomRole}}"
      }
  auth: inherit

docs:
  content: |
    Registers a new user with the given role (USER or ADMIN).
    Requires an ADMIN token: run mutation.loginAdmin first.

runtime:
  variables:
    - name: randomUsername
      value: newuser
    - name: randomPassword
      value: password123
    - name: randomRole
      value: USER

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
