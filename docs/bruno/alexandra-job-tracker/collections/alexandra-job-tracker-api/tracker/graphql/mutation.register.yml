info:
  name: mutation.register
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Accept
      value: application/json
  body:
    query: |
      mutation($username: String!, $password: String!, $role: Role!) { 
        register(username: $username, password: $password, role: $role) { token user { username role } } 
      }
    variables: |-
      {
        "username": "{{randomUsername}}",
        "password": "{{randomPassword}}",
        "role": "{{randomRole}}"
      }
  auth: inherit

runtime:
  variables:
    - name: randomUsername
      value: JPJE
    - name: randomPassword
      value: JPJE
    - name: randomRole
      value: ADMIN

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Registers a new user with the given role (USER or ADMIN).
  Requires an ADMIN token: run mutation.loginAdmin first.
