spring:
  application:
    group: dev.jpje.jobtracker
    name: alexandra-job-tracker
    version: 1.0.0
    admin:
      enabled: true
      jmx-name: "dev.jpje.jobtracker:type=Admin,name=SpringApplication"
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    connect-retries: 2
    connect-retries-interval: 5s
    enabled: true
    encoding: UTF-8
    validate-on-migrate: false
  ai:
    openai:
      api-key: ${LLM_API_KEY:sk-placeholder}
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-chat
  graphql:
    cors:
      allowed-origin-patterns:
      - "*"
      allowed-methods:
      - "*"
      allowed-headers:
      - "*"
      allow-credentials: true
      max-age: 3600
    graphiql:
      enabled: true
  cloud:
    aws:
      region:
        static: eu-west-1

server:
  port: 8880
  servlet:
    application-display-name: application
    context-path: /api

info:
  app:
    name: ${spring.application.name}
    version: ${spring.application.version}

jwt:
  secret: ${JWT_SECRET}

ajt:
  events:
    transport: spring

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,env,beans,mappings,loggers,configprops,caches
  endpoint:
    health:
      show-details: always
    env:
      show-values: always
    configprops:
      show-values: always
  info:
    env:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        jobtracker.submit.duration: true
        jobtracker.ai.analyze.duration: true
        http.server.requests: true
    tags:
      application: alexandra-job-tracker

otel:
  enabled: false

logging:
  level:
    root: INFO
    dev.jpje.jobtracker.server.event: DEBUG

---

spring:
  config:
    activate:
      on-profile: "dev"
  datasource:
    url: jdbc:h2:file:./deploy/data/jobtracker;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    show-sql: true

otel:
  enabled: true
  endpoint: http://localhost:4318/v1/traces
  exporter:
    otlp:
      endpoint: http://localhost:4318

---

spring:
  config:
    activate:
      on-profile: "aws"
  datasource:
    driver-class-name: org.postgresql.Driver
    url: "${NEON_DATABASE_URL:jdbc:postgresql://ep-cold-night-as5mvvsz.c-4.eu-central-1.aws.neon.tech/neondb?sslmode=require}"
    username: "${NEON_USER:neondb_owner}"
    password: "${NEON_PASSWORD:}"
    hikari:
      maximum-pool-size: 3
      initialization-fail-timeout: -1
  flyway:
    enabled: false
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate.ddl-auto: validate
    show-sql: false
  main:
    banner-mode: "off"

ajt:
  events:
    transport: sns
    sns-topic: "${SNS_TOPIC_ARN:}"
    sqs-queue: "${SQS_QUEUE_URL:}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

logging:
  level:
    root: WARN
    dev.jpje.jobtracker: INFO
    org.springframework: WARN
    org.hibernate: ERROR
    com.zaxxer.hikari: ERROR
    org.flywaydb: ERROR

---

spring:
  config:
    activate:
      on-profile: "db-migrate"
  flyway:
    enabled: true
  main:
    web-application-type: none

logging:
  level:
    root: WARN
    dev.jpje.jobtracker: INFO
    org.flywaydb: INFO
