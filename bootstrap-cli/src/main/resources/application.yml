spring:
  application:
    group: dev.jpje.jobtracker
    name: alexandra-job-tracker
    version: 1.0.0
    admin:
      enabled: true
      jmx-name: "dev.jpje.jobtracker:type=Admin,name=SpringApplication"
  profiles:
    default: dev
    active: ${SPRING_PROFILES_ACTIVE:dev}
  shell:
    command:
      version:
        enabled: true
        show-build-artifact: true
        show-build-group: true
        show-build-name: true
        show-build-time: true
        show-build-version: true
        show-git-branch: true
        show-git-commit-id: true
        show-git-commit-time: true
        show-git-short-commit-id: true
      completion:
        enabled: true
      quit:
        enabled: true
      clear:
        enabled: true
    history:
      enabled: true
    help:
      enabled: true
    interactive:
      enabled: true

server:
  url: http://localhost:8880/api
  connect-timeout: 5000
  request-timeout: 30000
